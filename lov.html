<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mi Amor 🍓</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-shadow: border-box;
    font-family: 'Arial Rounded MT Bold', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #ffb6c1; /* Fondo rosado */
    overflow: hidden;
    padding: 20px;
}

h1 {
    color: #ffffff; /* Texto blanco */
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 40px;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
    z-index: 10;
}

.contenedor-principal {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 250px;
    z-index: 10;
}

/* Escena de los ositos */
.escena-ositos {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.3s;
}

.escena-ositos:hover {
    transform: scale(1.05);
}

.oso-blanco, .oso-marron {
    font-size: 90px;
    user-select: none;
}

/* Animación de besitos */
.oso-blanco {
    animation: besoBlanco 2s infinite ease-in-out;
}

.oso-marron {
    animation: besoMarron 2s infinite ease-in-out;
}

@keyframes besoBlanco {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(25px) rotate(5deg); }
}

@keyframes besoMarron {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(-25px) rotate(-5deg); }
}

/* Corazones que brotan de los besos */
.corazon-beso {
    position: absolute;
    font-size: 30px;
    animation: flotarCorazon 2s infinite ease-in-out;
}

@keyframes flotarCorazon {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    50% { opacity: 1; transform: translateY(-40px) scale(1.3); }
    100% { transform: translateY(-80px) scale(0); opacity: 0; }
}

/* Escena del duende (oculta al principio) */
.escena-duende {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: aparecer 0.8s forwards ease-out;
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
}

.duende {
    font-size: 110px;
    margin-bottom: 20px;
    animation: flotarDuende 3s infinite ease-in-out;
}

@keyframes flotarDuende {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

.mensaje-final {
    color: #ffffff;
    font-size: 1.8rem;
    line-height: 1.5;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    max-width: 400px;
}

/* Lluvia de corazones de fondo */
.lluvia-corazon {
    position: absolute;
    top: -50px;
    color: #ff69b4;
    z-index: 1;
    animation: caer linear infinite;
}

@keyframes caer {
    from { transform: translateY(-50px) rotate(0deg); opacity: 0.8; }
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

    <!-- Título principal -->
    <h1 id="titulo">Hola mi corazón de frutilla</h1>

    <div class="contenedor-principal">
        
        <!-- Vista 1: Ositos dándose besos -->
        <div class="escena-ositos" id="bloqueOsitos" onclick="mostrarDuende()">
            <div class="oso-blanco">🐻‍❄️</div>
            <div class="corazon-beso">💖</div>
            <div class="oso-marron">🐻</div>
        </div>

        <!-- Vista 2: El duende bonito (Oculto) -->
        <div class="escena-duende" id="bloqueDuende">
            <div class="duende">🧝✨</div>
            <div class="mensaje-final">
                Te mando un buen abrazo y muchos besos.<br>
                <b>Love u, preciosa. Siempre tuya</b>
            </div>
        </div>

    </div>

<script>
// Crear corazones flotando de fondo de manera automática
for(let i=0; i<40; i++){
    let corazon = document.createElement("div");
    corazon.classList.add("lluvia-corazon");
    corazon.innerHTML = ["❤️","💖","🍓","💕"][Math.floor(Math.random()*4)];
    corazon.style.left = Math.random()*100 + "vw";
    corazon.style.fontSize = (15 + Math.random()*25) + "px";
    corazon.style.animationDuration = (5 + Math.random()*6) + "s";
    corazon.style.animationDelay = Math.random()*5 + "s";
    document.body.appendChild(corazon);
}

// Función que cambia los ositos por el duende al hacer click
function mostrarDuende() {
    document.getElementById("bloqueOsitos").style.display = "none";
    document.getElementById("titulo").style.display = "none";
    document.getElementById("bloqueDuende").style.display = "flex";
}
</script>
</body>
</html>
